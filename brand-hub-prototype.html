<title>Brand Hub</title>
<style>
/* Layout: sticky top bar, role switch (Ops / Supplier), page content in a centered 1200px column; tables scroll inside their own wrapper. */
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d67;
  --line:#e1e0d9; --axis:#c3c2b7; --wash:#f0efec; --accent:#2a78d6; --accent-soft:#cde2fb; --on-accent:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --serious:#ec835a; --good-ink:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 8px 24px rgba(11,11,11,.08);
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#a09e96;
  --line:#2c2c2a; --axis:#383835; --wash:#242422; --accent:#3987e5; --accent-soft:#184f95; --on-accent:#0b0b0b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#0ca30c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#a09e96;
  --line:#2c2c2a; --axis:#383835; --wash:#242422; --accent:#3987e5; --accent-soft:#184f95; --on-accent:#0b0b0b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#0ca30c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:16px} h3{font-size:13px;color:var(--ink2);font-weight:600}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 64px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.spacer{flex:1}
.seg{display:inline-flex;background:var(--wash);border-radius:10px;padding:3px}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr[data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550}
.btn:hover{background:var(--wash)}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-block:8px 16px}

.grid{display:grid;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:4px}

.kpi button{all:unset;cursor:pointer;display:block;width:100%}

.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);position:sticky;top:0}

tr:last-child td{border-bottom:0}

td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.small{font-size:12.5px;color:var(--ink2)}
.mono{font-family:var(--mono);font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=search],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
input[type=search]{width:240px;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill b{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;line-height:1}
.pill.warn b{color:#0b0b0b}
.good{--c:var(--good)} .warn{--c:var(--warn)} .crit{--c:var(--crit)} .info{--c:var(--accent)} .idle{--c:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--wash);font-size:12px;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.back{border:0;background:none;color:var(--ink2);cursor:pointer;padding:0;margin-bottom:6px}
.back:hover{color:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chart{position:relative}
.chart svg{display:block;width:100%;height:150px}
.chart .axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.hit{fill:transparent} .hit:hover{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;opacity:0;transform:translate(10px,10px);white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--wash);min-width:70px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.list{display:grid;gap:0}
.list>div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.list>div:last-child{border-bottom:0;padding-bottom:0}

.timeline li{display:grid;grid-template-columns:10px 1fr;gap:10px}

.timeline li.sys::before{background:var(--axis)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto}
.panel{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.overlay.center .panel{height:auto;border-radius:14px;width:min(520px,100%)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink2);font-weight:600}
.field select,.field input{width:100%}
.msg{background:var(--wash);border-radius:10px;padding:12px;font-size:13px;margin-bottom:10px;overflow-wrap:anywhere}
.msg .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.supbanner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;flex-wrap:wrap}
:root[data-theme="dark"] .supbanner{color:#f0efec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .supbanner{color:#f0efec}}
.req{display:grid;gap:12px}
.req .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.upl{border:1px dashed var(--axis);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .12s ease-out}@keyframes fade{from{opacity:0}}}

.shell{display:flex;min-height:100vh}
.main{flex:1;min-width:0}
.side{width:244px;flex:none;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;transition:width .15s}
.side[hidden]{display:none}
.side .logo{padding:6px 8px 14px;margin:0}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:16px 10px 6px}
.si{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--ink2);cursor:pointer;text-align:left;font-weight:500}
.si svg,.iconbtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.si:hover{background:var(--wash)}
.si[aria-current="page"]{background:var(--wash);color:var(--ink);font-weight:650;box-shadow:inset 2px 0 0 var(--accent)}
.si .tag{margin-left:auto}
.side-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--wash)}
.toplogo{display:none;margin:0}.toplogo.show{display:flex}
.scrim{display:none}
@media (min-width:861px){.side.collapsed{width:64px}.side.collapsed .lbl,.side.collapsed .si .tag{display:none}.side.collapsed .grp{height:1px;background:var(--line);padding:0;margin:10px 8px}.side.collapsed .si{justify-content:center}.side.collapsed .logo{justify-content:center}}
@media (max-width:860px){.side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .18s;width:248px}.side.open{transform:none;box-shadow:var(--shadow)}.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}.toplogo{display:flex}}
.cols2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start}
.prow{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.prow:last-of-type{border-bottom:0}
.prow input{width:100%}
.irow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.irow:last-of-type{border-bottom:0}
.tog{display:flex;gap:8px;align-items:center;padding:6px 0}
.tog input{width:16px;height:16px}
.attn{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.attn:last-child{border-bottom:0}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;margin-right:6px;vertical-align:-2px}
.btn.urgent{border-color:var(--crit);color:var(--crit);font-weight:650}
.btn.urgent:hover{background:color-mix(in srgb,var(--crit) 12%,transparent)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.alertbar{display:grid;gap:8px;background:color-mix(in srgb,var(--crit) 10%,var(--surface));border:1px solid var(--crit);border-radius:12px;padding:12px 14px;margin-bottom:16px}
</style>

<div class="shell">
<aside id="side" class="side" hidden></aside>
<div class="scrim" id="scrim" data-act="sidemob"></div>
<div class="main">
<div class="topbar"><div class="topbar-in" id="topbar"></div></div>
<div class="wrap">
  <div class="proto">Prototype with sample data. Brand names, suppliers, orders and numbers are made up. Nothing here is connected to Shopify or the Partner Success Portal yet.</div>
  <div id="app"></div>
</div>
</div>
</div>
<div id="tip"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- sample data ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(2026), ri=(a,b)=>Math.floor(R()*(b-a+1))+a, pick=a=>a[Math.floor(R()*a.length)];
const A=['Alder','Birch','Cedar','Dune','Ember','Fjord','Grove','Harbor','Iris','Juniper','Kestrel','Linden','Maple','Nova','Olive','Pine','Quill','Reed','Sage','Tide','Umber','Vale','Willow','Yarrow','Zephyr','Amber','Brook','Cove','Delta','Echo'];
const B=['Goods','Home','Supply','Studio','Labs','Outdoors','Kitchen','Pet Co','Wear','Beauty','Tools','Kids'];
const SUPPLIERS=[{id:0,name:'Northgate Supply',email:'orders@northgate.example',contact:'Priya Raman',phone:'+1 555 0111',wa:'+1 555 0112',backup:{name:'Tomas Lindgren',phone:'+1 555 0113'},hours:'8am to 6pm Pacific, Mon to Sat',seenMin:3},{id:1,name:'Harborline Fulfillment',email:'ops@harborline.example',contact:'Dev Okonkwo',phone:'+1 555 0121',wa:'+1 555 0122',backup:{name:'Mei Tanaka',phone:'+1 555 0123'},hours:'7am to 5pm Eastern, Mon to Fri',seenMin:190}];
const PEOPLE={ps:['Lynn','Beatriz','KC','Britni'],meta:['Priya Nair','Leo Brandt'],google:['Sam Ortega','Ana Lindqvist'],email:['Jo Mercer','Kai Abdi'],ops:['Rina Castillo','Ben Hoang']};
const NOUN={Goods:['Tote','Mug','Candle','Blanket','Planter','Tray','Journal'],Home:['Throw','Vase','Lamp','Rug','Cushion','Basket'],Supply:['Kit','Organizer','Bin','Caddy','Rack'],Studio:['Print','Frame','Brush Set','Palette','Canvas'],Labs:['Serum','Cleanser','Mist','Balm'],Outdoors:['Pack','Bottle','Tent Stake Set','Camp Mug','Hammock'],Kitchen:['Skillet','Knife','Board','Whisk','Colander'],'Pet Co':['Leash','Bed','Chew Toy','Bowl','Harness'],Wear:['Tee','Hoodie','Beanie','Socks','Jacket'],Beauty:['Lip Tint','Palette','Brush','Toner'],Tools:['Driver Set','Level','Tape','Clamp'],Kids:['Puzzle','Backpack','Blocks','Bib','Cup']};
const FIRST=['Maya','Noah','Ivy','Omar','Lena','Theo','Zoe','Ravi','Cleo','Hugo','Nia','Finn'];
const D0=new Date(2026,8,12);
const TODAY=new Date(2026,9,12);
const T0=Date.now();
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const CADENCES=[];['Weekly','Bi-weekly (Week A)','Bi-weekly (Week B)'].forEach(c=>['Monday','Tuesday','Wednesday','Thursday','Friday'].forEach(d=>CADENCES.push(c+' - '+d)));
const LAST=['Alvarez','Brooks','Chen','Dubois','Eriksen','Fofana','Grant','Haddad','Ito','Jensen','Kaur','Lopez'];
const OPEN_ACTIONS=['Send Q4 plan','Share creative results','Review return reasons','Confirm BFCM inventory','Schedule renewal call'];
const ISSUE_TEXT=['Meta payment method declined','Google Merchant Center disapproved products','Supplier delays on restock','Pixel not firing on checkout','Creative refresh needed','Zendesk backlog over 48 hours'];
const CREATIVE=['Mira Solis','Dev Patel','Hana Kim'], UGC=['Cory Blake','Isla Reyes','Noor Haddad'];
const R2=rng(777), ri2=(a,b)=>Math.floor(R2()*(b-a+1))+a, pick2=a=>a[Math.floor(R2()*a.length)];
const STREETS=['Maple Ave','Cedar St','Lakeview Dr','Oak Lane','Harbor Rd','Pine Ct','Sunset Blvd'], CITIES=[['Austin','TX','78701'],['Denver','CO','80202'],['Portland','OR','97205'],['Raleigh','NC','27601'],['Columbus','OH','43215'],['Tampa','FL','33602']];

const dayLabel=i=>new Date(2026,8,12+i).toLocaleDateString('en-US',{month:'short',day:'numeric'});

const brands=[];
for(let i=0;i<72;i++){
  const suffix=B[(i*7+Math.floor(i/30)*5)%12], name=A[i%30]+' '+suffix;
  const base=Math.exp(R()*3.1)*20000, trend=(R()-.42)*.5;
  const series=Array.from({length:30},(_,d)=>Math.max(200,base/30*(1+trend*(d/30-.5)+(R()-.5)*.55)));
  const revenue=series.reduce((a,b)=>a+b,0), delta=(R()-.35)*.55;
  const aov=ri(38,120), orders=Math.round(revenue/aov);
  const metaSp=revenue*(.08+R()*.14), googSp=revenue*(.04+R()*.1);
  brands.push({id:i,name,suffix,slug:name.toLowerCase().replace(/[^a-z]+/g,'-'),supplier:R()<.5?0:1,mode:R()<.55?'dropship':'warehouse',
    revenue,delta,series,orders,aov,returnRate:.02+R()*.12,
    meta:{spend:metaSp,rev:metaSp*(1.6+R()*3),owner:pick(PEOPLE.meta)},
    google:{spend:googSp,rev:googSp*(2+R()*4),owner:pick(PEOPLE.google)},
    email:{rev:revenue*(.08+R()*.18),sends:ri(8,40),owner:pick(PEOPLE.email),list:ri(4,90)*1000},
    syncMin:R()<.08?ri(300,2600):ri(1,22),
    owner:pick(PEOPLE.ps),renewal:new Date(2027,ri(0,11),ri(1,28)),currency:R()<.8?'USD':pick(['CAD','GBP','EUR']),
    skus:[],orderRows:[],cadence:pick(CADENCES),contacts:[],issues:[],notes:'',zendesk:'',gslack:'',mslack:'',creative:pick(CREATIVE),ugc:pick(UGC),uploads:'',accountDown:R()<.07,googleOn:R()<.92,metaOn:R()<.92});
}
const rankSorted=[...brands].sort((a,b)=>b.revenue-a.revenue);
rankSorted.forEach((b,i)=>b.tier=i<12?'A':i<40?'B':'C');
/* COGS = (product cost + inbound freight & duties + packaging) × units sold. Shipping to customers and ad spend are not COGS. */
const landed=s=>s.cost==null?null:s.cost+s.freight+s.pack;
function recalc(b){let rev=0,cogs=0,miss=0;b.skus.forEach(s=>{const l=landed(s);if(l==null){miss++;return}rev+=s.u*s.price;cogs+=s.u*l});b.cogs=cogs;b.costedRev=rev;b.gp=rev-cogs;b.gm=rev?b.gp/rev:0;b.missCost=miss}
brands.forEach(b=>{
  const n=ri(5,8), nouns=NOUN[b.suffix], units=b.orders*(1.3+R()*.5), w=Array.from({length:n},()=>.3+R()), ws=w.reduce((a,c)=>a+c,0);
  for(let k=0;k<n;k++){
    const u=Math.max(3,Math.round(units*w[k]/ws)), vel=u/30, onHand=R()<.1?0:Math.round(vel*ri(3,60)), rp=Math.round(vel*14);
    const price=(b.revenue/units)*(.55+R()*.9), cost=R()<.06?null:price*(.26+R()*.22);

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function nextScheduled(after,label){
  const m=/^(Weekly|Bi-weekly \(Week ([AB])\)) - (\w+)$/.exec(label||'');if(!m)return null;
  const wd=DAYS.indexOf(m[3]);
  for(let i=1;i<=30;i++){const d=new Date(after.getFullYear(),after.getMonth(),after.getDate()+i);if(d.getDay()!==wd)continue;if(m[2]&&((m[2]==='A')!==(isoWeek(d)%2===1)))continue;return d}
  return null;
}

const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function urg(d){if(!d)return 'unset';const diff=Math.round((d-TODAY)/864e5);return diff<=-3?'overdue':diff<=2?'soon':'ok'}
const URG={overdue:['crit','!','Overdue'],soon:['warn','!','Due soon'],ok:['good','✓','On track'],unset:['idle','○','Not set']};
const duePill=d=>{const x=URG[urg(d)];return `<span class="pill ${x[0]}"><b>${x[1]}</b>${fdate(d)} · ${x[2]}</span>`};
const safeUrl=u=>/^https?:\/\//.test(u||'');

(function(){const T=['Added an issue','Resolved an issue','Marked Meta Ads running','Marked Google Ads off','Changed cadence','Logged contact with a partner','Updated manual notes','Reassigned the brand'];for(let i=0;i<16;i++){const b=pick(brands);activity.push({at:Date.now()-ri(1,300)*36e5,who:pick(PEOPLE.ps),brand:b.name,id:b.id,text:pick(T)})}activity.sort((a,c)=>c.at-a.at)})();

const TERMS=['Prepaid','50% deposit, 50% before shipping','Net 15','Net 30'];

const rel=d=>{const n=Math.round((d-TODAY)/864e5);return n===0?'today':n>0?`in ${n} day${n>1?'s':''}`:`${-n} day${n<-1?'s':''} ago`};

const poSub=po=>po.lines.reduce((a,l)=>a+l.qty*l.unit,0), poTotal=po=>poSub(po)+po.freight;
const poPays=po=>payments.filter(p=>p.poId===po.id), poPaid=po=>poPays(po).filter(p=>p.paidOn).reduce((a,p)=>a+p.amount,0);
const poUnits=po=>po.lines.reduce((a,l)=>a+l.qty,0);

const poOpen=po=>['Sent','Confirmed','In production','Shipped'].includes(po.status);
const PO_FLOW=['Draft','Sent','Confirmed','In production','Shipped','Received'];

const poPill=po=>{const x=POS[po.status];return `<span class="pill ${x[0]}"><b>${x[1]}</b>${po.status}</span>`+(poLate(po)?` <span class="pill crit"><b>!</b>Late</span>`:'')+(po.changeReq?` <span class="pill warn"><b>!</b>Changes requested</span>`:'')};
const PAYS={overdue:['crit','!','Overdue'],soon:['warn','!','Due soon'],scheduled:['idle','○','Scheduled'],paid:['good','✓','Paid']};
function payStatus(p){if(p.paidOn)return 'paid';const n=Math.round((p.due-TODAY)/864e5);return n<0?'overdue':n<=7?'soon':'scheduled'}
const paySpill=p=>{const x=PAYS[payStatus(p)];return `<span class="pill ${x[0]}"><b>${x[1]}</b>${x[2]}</span>`};
function genPays(po){
  const tot=poTotal(po), mk=(kind,amt,due)=>payments.push({id:'PAY-'+(++paySeq),poId:po.id,supplier:po.supplier,brandId:po.brandId,kind,amount:Math.round(amt*100)/100,due,paidOn:null,method:'',ref:''});

(function seedPOs(){
  const plan=[['Draft',1],['Sent',2],['Sent',1],['Sent',3],['Confirmed',7],['Confirmed',9],['Confirmed',6],['In production',18],['In production',22],['In production',27],['Shipped',30],['Shipped',28],['Shipped',33],['Received',45],['Received',52],['Received',60],['Received',41],['Cancelled',12]];

    po.freight=Math.round(poSub(po)*.04);

const parseISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
function poStats(list){
  const c=list.filter(po=>po.status!=='Draft'&&po.status!=='Cancelled'), pays=c.flatMap(poPays), paid=pays.filter(p=>p.paidOn).reduce((a,p)=>a+p.amount,0), un=pays.filter(p=>!p.paidOn), pending=un.reduce((a,p)=>a+p.amount,0), od=un.filter(p=>payStatus(p)==='overdue');
  return {n:c.length,paid,pending,total:paid+pending,overdue:od.reduce((a,p)=>a+p.amount,0),odN:od.length,unN:un.length,paidN:pays.length-un.length,open:c.filter(poOpen).length,received:c.filter(po=>po.status==='Received').length};

function poRangeBounds(){
  const r=S.poRange;
  if(r==='month')return [new Date(TODAY.getFullYear(),TODAY.getMonth(),1),new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0)];
  if(r==='30')return [addD(TODAY,-29),TODAY];
  if(r==='90')return [addD(TODAY,-89),TODAY];
  if(r==='next30')return [TODAY,addD(TODAY,30)];
  if(r==='custom')return [S.poFrom?parseISO(S.poFrom):null,S.poTo?parseISO(S.poTo):null];
  return [null,null];
}
const poInRange=po=>{const [a,b]=poRangeBounds(),d=S.poBasis==='eta'?po.eta:po.createdOn;return (!a||d>=a)&&(!b||d<=b)};

/* ---------- sorting ---------- */
const SORT={}, GSORT={}, MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function cmpVals(a,b){if(typeof a==='number'&&typeof b==='number')return a-b;if(typeof a==='number')return -1;if(typeof b==='number')return 1;return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}
function sortBy(list,acc,tbl,def){
  const st=SORT[tbl]||def, f=acc[st.k]||acc[def.k], keyed=list.map((x,i)=>({x,i,v:f(x)}));
  const has=keyed.filter(o=>o.v!=null&&o.v!==''), none=keyed.filter(o=>o.v==null||o.v==='');
  has.sort((a,b)=>cmpVals(a.v,b.v)*st.dir||a.i-b.i);
  return has.concat(none).map(o=>o.x);
}
const sth=(t,k,label,cls,d)=>{const s=SORT[t]||{},on=s.k===k;return `<th class="${cls||''}" aria-sort="${on?(s.dir>0?'ascending':'descending'):'none'}"><button data-act="ssort" data-t="${t}" data-k="${k}" data-d="${d||1}">${label}${on?(s.dir>0?' ↑':' ↓'):''}</button></th>`};
function parseVal(s){
  let m;s=s.trim();
  if(m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s))return +new Date(+m[1],+m[2]-1,+m[3]);
  if(m=/^([A-Z][a-z]{2}) (\d{1,2})(?:, (\d{4}))?$/.exec(s)){const mo=MONTHS.indexOf(m[1]);if(mo>=0)return +new Date(+(m[3]||2026),mo,+m[2])}
  if(m=/^#(\d+)$/.exec(s))return +m[1];
  if(m=/^([−-]?)\$?([\d,]+(?:\.\d+)?)\s*([kKmM%x])?(?:\s|$)/.exec(s)){let v=parseFloat(m[2].replace(/,/g,''));if(m[3]==='k'||m[3]==='K')v*=1e3;if(m[3]==='m'||m[3]==='M')v*=1e6;return m[1]?-v:v}
  return null;
}
function cellVal(td){
  if(!td)return null;
  let raw;
  if(td.dataset.v!==undefined)raw=td.dataset.v;
  else{const i=td.querySelector('input,select');raw=i?(i.tagName==='SELECT'?i.options[i.selectedIndex].text:i.value):(td.innerText||td.textContent).trim().split('\n')[0].trim()}
  if(raw===''||raw==='–'||raw==='-')return null;
  const n=parseVal(raw);return n!=null?n:(isNaN(+raw)?raw:+raw);
}
const pinnedRow=r=>!!r.querySelector('td[colspan]')||(r.cells[0]&&r.cells[0].textContent.trim()==='Total');
function applyG(t){
  const st=GSORT[t._key];if(!st)return;
  const rows=[...t.tBodies[0].rows], pin=rows.filter(pinnedRow), rest=rows.filter(r=>!pinnedRow(r));
  const keyed=rest.map(r=>({r,i:r._i,v:cellVal(r.cells[st.c])})), has=keyed.filter(o=>o.v!=null), none=keyed.filter(o=>o.v==null);
  has.sort((a,b)=>cmpVals(a.v,b.v)*st.dir||a.i-b.i);
  t.tBodies[0].append(...has.concat(none).map(o=>o.r),...pin);
  [...t.tHead.rows[0].cells].forEach((th,c)=>{const b=th.querySelector('.sortb');if(!b)return;const on=c===st.c;th.setAttribute('aria-sort',on?(st.dir>0?'ascending':'descending'):'none');b.querySelector('.arr').textContent=on?(st.dir>0?' ↑':' ↓'):''});
}
function enhanceTables(root,scope){
  root.querySelectorAll('table').forEach((t,ti)=>{
    if(!t.tHead||!t.tBodies[0]||t.querySelector('th button'))return;
    t._key=scope+':'+S.page+':'+S.tab+':'+ti;
    [...t.tHead.rows[0].cells].forEach((th,c)=>{const l=th.textContent.trim();if(!l)return;th.innerHTML=`<button class="sortb" data-c="${c}">${esc(l)}<span class="arr"></span></button>`;th.setAttribute('aria-sort','none')});
    [...t.tBodies[0].rows].forEach((r,i)=>r._i=i);
    applyG(t);
  });
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest&&ev.target.closest('.sortb');if(!b)return;
  const t=b.closest('table'),c=+b.dataset.c,st=GSORT[t._key];
  GSORT[t._key]=st&&st.c===c?{c,dir:-st.dir}:{c,dir:b.closest('th').classList.contains('num')?-1:1};applyG(t);

/* ---------- urgent alerts: reach a supplier in real time ---------- */
const nowMs=()=>Date.now()+S.skew;
const alerts=[]; let altSeq=0;
const ESC_STEPS=[[0,'Alert sent'],[5,'SMS reminder'],[10,'Automatic phone call'],[20,'Call the backup contact']];
const supOfRef=ref=>{const r=requests.find(x=>x.id===ref);if(r)return r.supplier;const p=purchaseOrders.find(x=>x.id===ref);return p?p.supplier:null};

const ALERT_TPL={hold:['Hold the shipment now',l=>`URGENT: please hold ${l} and do not ship until we confirm. Reply as soon as you see this.`],address:['Address changed, please confirm',l=>`URGENT: the shipping address on ${l} changed. Please confirm you have the new address before it ships.`],cancel:['Cancel immediately',l=>`URGENT: please cancel ${l} right now if it has not shipped. Reply to confirm.`],tracking:['Need tracking now',l=>`URGENT: we need the tracking number for ${l} now. Please reply with it.`],custom:['Custom message',l=>'']};

const alertsOpen=()=>alerts.filter(aOpen).length;
const mins=a=>(nowMs()-a.sentAt)/6e4;

  const m=mins(a),st=ESC_STEPS.filter(s=>m>=s[0]).pop();return `<span class="pill crit"><b>!</b>No reply · ${st[1]}</span>`;
}
const presence=s=>S.role==='supplier'&&S.supplierId===s.id?'Active in the portal now':s.seenMin<10?`Active in the portal ${s.seenMin} min ago`:`Last in the portal ${ago(s.seenMin/60)}`;

}

  <div style="margin:14px 0">${aPill(a)}</div>

  ${a.ref?`<p class="small" style="margin:0 0 12px">About <button class="link mono" data-act="${requests.some(r=>r.id===a.ref)?'openreq':'openpo'}" data-id="${a.ref}">${a.ref}</button></p>`:''}
  <div class="row" style="margin-bottom:16px">${!a.resolved?`<button class="btn primary" data-act="altresolve" data-id="${a.id}">Mark resolved</button>`:''}<a class="btn" href="${waLink(s,out?a.message:'')}" target="_blank" rel="noopener">Open WhatsApp</a>${out&&a.status==='open'?`<button class="btn" data-act="altresend" data-id="${a.id}">Resend now</button><button class="btn" data-act="altskip" data-id="${a.id}">Skip ahead 5 min (demo)</button>`:''}</div>
  ${out?`<h3 style="margin:0 0 10px">Escalation</h3><ul class="timeline">${ladder}</ul><p class="small" style="margin:10px 0 0">${a.status!=='open'?'Escalation stopped because the supplier replied.':'We keep escalating until the supplier replies in the portal or on WhatsApp.'}</p>`:`<p class="small">Reply here or by WhatsApp. Marking it resolved closes the alert.</p>`}

function renderInventory(){
  let skus=[];brands.forEach(b=>b.skus.forEach(s=>skus.push(Object.assign({b},s))));

  skus=skus.filter(s=>(!S.invQ||(s.name+s.sku+s.b.name).toLowerCase().includes(S.invQ.toLowerCase()))&&(S.invRisk!=='risk'||stockState(s)[0]!=='good')&&(!S.invBrand||s.b.mode===S.invBrand));

  createpo:e=>{
    const b=brandById(+$('#npb').value), lines=[];
    for(let k=0;k<3;k++){const si=$('#ps'+k).value,q=parseInt($('#pq'+k).value,10),u=parseFloat($('#pu'+k).value);if(si===''&&!(q>0))continue;if(si===''||!(q>0)||!(u>0)){$('#nperr').textContent='Each item needs a product, a quantity and a unit cost.';return}const s=b.skus[+si];lines.push({sku:s.sku,name:s.name,qty:q,unit:u,recv:0})}
    if(!lines.length){$('#nperr').textContent='Add at least one item.';return}
    const eta=$('#npe').value.split('-').map(Number), send=e.dataset.send==='1';
    const po={id:'PO-'+(++poSeq),brandId:b.id,supplier:b.supplier,createdOn:new Date(TODAY),sentOn:send?new Date(TODAY):null,status:send?'Sent':'Draft',terms:$('#npt').value,lines,freight:0,tracking:'',carrier:'',receivedOn:null,eta:new Date(eta[0],eta[1]-1,eta[2]),events:[]};
    po.freight=Math.round(poSub(po)*.04);poEvent(po,'PO created by You');
    purchaseOrders.unshift(po);
    if(send){poEvent(po,'Sent to '+supName(po.supplier)+' by email and WhatsApp');genPays(po);adjIncoming(po,1)}
    render();poDrawer(po.id);toast(send?'PO sent to '+supName(po.supplier):'Draft saved');
  },
  posend:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id);po.status='Sent';po.sentOn=new Date(TODAY);genPays(po);adjIncoming(po,1);poEvent(po,'Sent to '+supName(po.supplier)+' by email and WhatsApp');render();poDrawer(po.id);toast('PO sent. Payments scheduled.')},
  poadv:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id);po.status=PO_FLOW[PO_FLOW.indexOf(po.status)+1];poEvent(po,po.status==='Confirmed'?'Supplier confirmed':'Supplier started production');render();poDrawer(po.id);toast('PO marked '+po.status.toLowerCase())},
  poship:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id),t=$('#po-track').value.trim();if(!t){toast('Enter the tracking or container number');return}po.status='Shipped';po.carrier=$('#po-carrier').value;po.tracking=t;poEvent(po,'Shipped with tracking '+t);render();poDrawer(po.id);toast('PO marked shipped')},
  porecvform:e=>{S.recvOpen=e.dataset.id;poDrawer(e.dataset.id)},
  porecv:e=>{
    const po=purchaseOrders.find(x=>x.id===e.dataset.id), b=brandById(po.brandId);let total=0,short=false;
    po.lines.forEach((l,k)=>{const q=Math.max(0,parseInt($('#rc-'+k).value,10)||0);l.recv=q;total+=q;if(q<l.qty)short=true;const s=b.skus.find(x=>x.sku===l.sku);if(s){s.incoming=Math.max(0,s.incoming-l.qty);s.onHand+=q}});
    po.status='Received';po.receivedOn=new Date(TODAY);poEvent(po,`Received ${total} of ${poUnits(po)} units${short?' (short shipment)':''}. Stock added to ${b.name}.`);
    S.recvOpen=null;render();poDrawer(po.id);toast('Stock received. Inventory updated.')},
  pocancel:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id);if(po.status!=='Draft')adjIncoming(po,-1);po.status='Cancelled';for(let i=payments.length-1;i>=0;i--)if(payments[i].poId===po.id&&!payments[i].paidOn)payments.splice(i,1);poEvent(po,'PO cancelled. Unpaid payments removed.');render();poDrawer(po.id);toast('PO cancelled')},
  paymodal:e=>payModal(e.dataset.id),
  savepay:e=>{
    const p=payments.find(x=>x.id===e.dataset.id), ref=$('#pm-ref').value.trim(), d=$('#pm-date').value.split('-').map(Number);
    if(!ref){$('#pm-err').textContent='Enter the reference or confirmation number.';return}
    p.paidOn=new Date(d[0],d[1]-1,d[2]);p.method=$('#pm-method').value;p.ref=ref;
    const po=purchaseOrders.find(x=>x.id===p.poId);poEvent(po,`${p.kind} of ${money0(p.amount)} paid by ${p.method} (${ref})`);
    const from=S.page;render();toast('Payment recorded');
  },
  viewdoc:e=>docViewer(e.dataset.id),
  doctype:e=>{S.docType=e.dataset.k;render()},
  urgent:e=>urgentModal({ref:e.dataset.ref,sup:e.dataset.sup}),
  sendurgent:()=>{
    const m=$('#um').value.trim(),ref=$('#uref').value,sid=ref?supOfRef(ref):+$('#us').value;
    if(!m){$('#uerr').textContent='Write the message the supplier will see.';return}
    const ch=['portal'];if($('#uc-wa').checked)ch.push('whatsapp');if($('#uc-sms').checked)ch.push('sms');if($('#uc-call').checked)ch.push('call');
    const a=sendAlert({supplier:sid,ref,template:$('#ut').value,message:m,channels:ch});
    render();alertDrawer(a.id);toast('Urgent alert sent to '+supName(sid));
  },
  openalert:e=>alertDrawer(e.dataset.id),
  altf:e=>{S.altF=e.dataset.k;render()},
  altresolve:e=>{const a=alerts.find(x=>x.id===e.dataset.id);a.resolved=true;render();alertDrawer(a.id);toast('Marked resolved')},
  altresend:e=>{const a=alerts.find(x=>x.id===e.dataset.id);a.sentAt=nowMs();render();alertDrawer(a.id);toast('Alert sent again on '+a.channels.length+' channels')},
  altskip:e=>{S.skew+=5*6e4;render();alertDrawer(e.dataset.id);toast('Skipped ahead 5 minutes')},
  supack:e=>{const a=alerts.find(x=>x.id===e.dataset.id);a.status='acked';a.ackedAt=nowMs();a.reply=e.dataset.reply;render();toast('Sent. The brand team can see your reply.')},
  supreply:e=>{const v=$('#ar-'+e.dataset.id).value.trim();if(!v){toast('Type a reply first');return}const a=alerts.find(x=>x.id===e.dataset.id);a.status='acked';a.ackedAt=nowMs();a.reply=v;render();toast('Sent. The brand team can see your reply.')},
  supurgent:()=>supUrgentModal(),
  supsendurgent:()=>{const m=$('#su-msg').value.trim();if(!m){$('#su-err').textContent='Tell us what you need.';return}sendAlert({dir:'in',supplier:S.supplierId,ref:$('#su-ref').value,message:m,channels:['portal'],by:SUPPLIERS[S.supplierId].contact});render();toast('Sent. The ops team is alerted right now.')},
  addrform:e=>addrModal(e.dataset.id),
  addrsave:e=>{
    const r=requests.find(x=>x.id===e.dataset.id),a=readAddr('ae');
    if(!a){$('#ae-err').textContent='Complete the address: name, street, city, state and ZIP.';return}
    const why=$('#ae-why').value,urgent=$('#ae-urgent').checked;
    r.addrOld=r.addr;r.addr=a;r.addrPending=true;r.addrConflict=false;r.addrHistory.unshift({at:Date.now(),by:'You',old:r.addrOld,new:a,reason:why});
    r.events.unshift({sys:true,t:`Shipping address changed (${why}): ${addrStr(a)}`,ago:0});
    if(urgent)sendAlert({supplier:r.supplier,ref:r.id,template:'address',message:`URGENT: the address on ${r.id} (order #${r.orderNo}) changed. New address: ${addrStr(a)}. Please confirm before it ships.`,channels:['portal','whatsapp','sms']});
    render();reqDrawer(r.id);toast(urgent?'Address changed. Supplier alerted now.':'Address changed. The supplier must confirm it.');
  },
  supaddrok:e=>{const r=requests.find(x=>x.id===e.dataset.id);r.addrPending=false;r.events.unshift({sys:false,t:'Supplier confirmed the new address',ago:0});alerts.filter(a=>a.ref===r.id&&a.template==='address'&&a.status==='open').forEach(a=>{a.status='acked';a.ackedAt=nowMs();a.reply='Confirmed the new address.'});render();toast('Thanks. The brand team can see you confirmed.')},
  supaddrno:e=>{const r=requests.find(x=>x.id===e.dataset.id);r.addrPending=false;r.addrConflict=true;r.events.unshift({sys:false,t:'Supplier says it already shipped to the old address',ago:0});sendAlert({dir:'in',supplier:r.supplier,ref:r.id,message:`${r.id} already shipped to the old address (${addrStr(r.addrOld)}). Please advise.`,channels:['portal'],by:SUPPLIERS[r.supplier].contact});render();toast('The ops team is alerted right now.')},
  suptab:e=>{S.supTab=e.dataset.t;render()},
  supconfirm:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id),no=$('#so-'+po.id).value.trim(),d=$('#sd-'+po.id).value.split('-').map(Number);po.status='Confirmed';if(no)po.supplierRef=no;if(d.length===3&&!d.some(isNaN))po.eta=new Date(d[0],d[1]-1,d[2]);poEvent(po,`Supplier confirmed${no?' (order '+no+')':''}, arrival ${fdate(po.eta)}`);render();toast('PO confirmed. The brand team is notified.')},
  supprod:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id);po.status='In production';poEvent(po,'Supplier started production');render();toast('Marked in production')},
  supship:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id),t=$('#st-'+po.id).value.trim(),f=$('#sf-'+po.id).files[0];if(!t){toast('Enter the tracking or container number');return}po.status='Shipped';po.carrier=$('#sc-'+po.id).value;po.tracking=t;if(f){po.docs=[f.name];po.docObjs=[f];po.docsAt=Date.now()}poEvent(po,`Supplier shipped with ${po.carrier} ${t}${f?' and attached '+f.name:''}`);render();toast('Marked shipped. The brand team is notified.')},
  supchangemodal:e=>textModal('Request changes',e.dataset.id+'. The brand team sees this and replies.','What needs to change?','supchange',e.dataset.id,'Send to brand team'),
  supchange:e=>{const v=$('#tm-text').value.trim();if(!v){$('#tm-err').textContent='Describe the change you need.';return}const po=purchaseOrders.find(x=>x.id===e.dataset.id);po.changeReq=v;poEvent(po,'Supplier requested changes: '+v);render();toast('Sent to the brand team')},
  poresolve:e=>{const po=purchaseOrders.find(x=>x.id===e.dataset.id);po.changeReq='';poEvent(po,'Change request marked resolved');render();poDrawer(po.id);toast('Marked resolved')},
  invmodal:e=>invModal(e.dataset.id,e.dataset.pay),
  saveinv:e=>{
    const po=purchaseOrders.find(x=>x.id===e.dataset.id),p=payments.find(x=>x.id===$('#iv-pay').value),num=$('#iv-num').value.trim(),amt=parseFloat($('#iv-amt').value.replace(/[$,\s]/g,'')),f=$('#iv-file').files[0];
    if(!num){$('#iv-err').textContent='Enter your invoice number.';return}
    if(!(amt>0)){$('#iv-err').textContent='Enter the invoice amount.';return}
    if(!f){$('#iv-err').textContent='Attach the invoice file.';return}
    const dd=$('#iv-date').value.split('-').map(Number), du=$('#iv-due').value.split('-').map(Number);
    const inv={id:'INV'+(++invSeq),number:num,poId:po.id,paymentId:p.id,supplier:po.supplier,brandId:po.brandId,amount:amt,expected:p.amount,issued:new Date(dd[0],dd[1]-1,dd[2]),due:new Date(du[0],du[1]-1,du[2]),file:f.name,fileObj:f,at:Date.now(),note:$('#iv-note').value.trim(),status:'Submitted',reviewNote:'',ago:0};
    invoices.push(inv);p.invoiceId=inv.id;
    poEvent(po,`Supplier added invoice ${num} for ${money0(amt)}${amt!==p.amount?' (PO says '+money0(p.amount)+')':''}`);
    render();toast(amt!==p.amount?'Invoice sent. It differs from the PO, so the brand team will check it.':'Invoice sent for review')},
  invapprove:e=>{const i=invoices.find(x=>x.id===e.dataset.id),p=payments.find(x=>x.id===i.paymentId),po=purchaseOrders.find(x=>x.id===i.poId);i.status='Approved';if(p){p.amount=i.amount;p.due=i.due}poEvent(po,`Invoice ${i.number} approved. Payment of ${money0(i.amount)} due ${fdate(i.due)}`);render();toast('Invoice approved. Payment scheduled.')},
  invdisputemodal:e=>{const i=invoices.find(x=>x.id===e.dataset.id);textModal('Dispute invoice',`${i.number} · ${money0(i.amount)} from ${supName(i.supplier)}`,'What is wrong? The supplier sees this.','invdispute',i.id,'Send to supplier')},
  invdispute:e=>{const v=$('#tm-text').value.trim();if(!v){$('#tm-err').textContent='Say what is wrong so the supplier can fix it.';return}const i=invoices.find(x=>x.id===e.dataset.id),p=payments.find(x=>x.id===i.paymentId),po=purchaseOrders.find(x=>x.id===i.poId);i.status='Disputed';i.reviewNote=v;if(p)p.invoiceId=null;poEvent(po,`Invoice ${i.number} disputed: ${v}`);render();toast('Sent back to the supplier')},
  createreq:()=>{
    const b=brandById(+$('#nb').value), no=$('#no').value.replace(/\D/g,''), q=parseInt($('#nq').value,10);
    if(!no){$('#nerr').textContent='Enter the Shopify order number.';return}
    if(!(q>0)){$('#nerr').textContent='Quantity must be 1 or more.';return}
    const ad=readAddr('na');if(!ad){$('#nerr').textContent='Complete the address: name, street, city, state and ZIP.';return}
    const sk=b.skus[+$('#ns').value];
    const r=mkReq({type:$('#nt').value,brandId:b.id,supplier:b.supplier,orderNo:no,items:[{sku:sk.sku,name:sk.name,qty:q}],reason:$('#nr').value,addr:ad,by:'You',hoursAgo:0});
    requests.unshift(r);render();reqDrawer(r.id);toast('Supplier notified by email and WhatsApp');
  },
  /* supplier */
  ack:e=>{updateReq(e.dataset.id,r=>r.status='ack','Supplier acknowledged');render();toast('Acknowledged')},
  submitreturn:e=>{
    const id=e.dataset.id, t=$('#t-'+id).value.trim(), f=$('#f-'+id).files[0];
    if(!f){toast('Upload the return label first');return}
    if(!t){toast('Enter the tracking number');return}
    updateReq(id,r=>{r.status='done';r.tracking=t;r.carrier=$('#c-'+id).value;r.label=f.name;r.labelFile=f;r.labelAt=Date.now()},`Supplier uploaded return label (${f.name}) and tracking ${t}`);
    updateReq(id,()=>{},'Label attached to the Shopify return and emailed to the customer',true);render();toast('Sent. The customer gets the label by email.');
  },
  submitship:e=>{
    const id=e.dataset.id, t=$('#t-'+id).value.trim();
    if(!t){toast('Enter the tracking number');return}
    updateReq(id,r=>{r.status='done';r.tracking=t;r.carrier=$('#c-'+id).value},`Supplier marked shipped with tracking ${t}`);
    updateReq(id,()=>{},'Fulfillment created in Shopify with tracking',true);render();toast('Marked shipped. Shopify is updated.');
  },
  cxlok:e=>{updateReq(e.dataset.id,r=>{r.status='done';r.carrier='n/a';r.tracking='Cancelled'},'Supplier confirmed not shipped');updateReq(e.dataset.id,()=>{},'Order cancelled and refunded in Shopify',true);render();toast('Cancellation confirmed')},
  cxlno:e=>{updateReq(e.dataset.id,r=>{r.status='declined';r.note='Already shipped. Cannot cancel.'},'Supplier replied: already shipped, cannot cancel');render();toast('Ops team has been told')},
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.matches('input[type=checkbox]'))return;
  const f=ACTIONS[el.dataset.act];if(f){if(el.dataset.act==='closelayer'&&ev.target!==el)return;f(el,ev)}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.ps){psEdit(t);return}
  if(t.dataset.po==='eta'){const po=purchaseOrders.find(x=>x.id===t.dataset.id),d=t.value.split('-').map(Number);if(d.length!==3||d.some(isNaN))return;po.eta=new Date(d[0],d[1]-1,d[2]);poEvent(po,'ETA changed to '+fdateY(po.eta));render();poDrawer(po.id);toast('ETA updated');return}
  if(t.dataset.po==='sku'){const b=brandById(+$('#npb').value),k=t.dataset.k;if(t.value!==''){const sk=b.skus[+t.value];$('#pu'+k).value=sk.cost!=null?sk.cost.toFixed(2):'';if(!$('#pq'+k).value)$('#pq'+k).value=Math.max(24,Math.round(sk.vel*45/12)*12)}return}
  if(t.dataset.cost){
    const b=brandById(+t.dataset.id), s=b.skus[+t.dataset.i], f=t.dataset.cost, raw=t.value.replace(/[$,\s]/g,''), v=parseFloat(raw);
    if(f==='cost')s.cost=raw===''||isNaN(v)||v<0?null:v; else s[f]=isNaN(v)||v<0?0:v;
    if(f!=='cost'&&s.cost==null){toast('Add a unit cost first')}
    recalc(b);render();toast(s.cost==null?'Unit cost cleared':'Cost updated. COGS recalculated.');return}
  if(t.id==='supsel'){S.supplierId=+t.value;render()}
  else if(t.id==='fmode'){S.mode=t.value;S.show=20;$('#tbl').innerHTML=brandTable()}
  else if(t.id==='fsup'){S.supplier=t.value;S.show=20;$('#tbl').innerHTML=brandTable()}
  else if(t.id==='fhealth'){S.health=t.value;S.show=20;$('#tbl').innerHTML=brandTable()}
  else if(t.id==='rtype'){S.rtype=t.value;render()}
  else if(t.id==='rsup'){S.rsup=t.value;render()}
  else if(t.id==='invrisk'){S.invRisk=t.value;render()}
  else if(t.id==='invmode'){S.invBrand=t.value;render()}
  else if(t.id==='tass'){S.tAss=t.value;S.tShow=40;render()}
  else if(t.id==='nb')fillNewReq();
  else if(t.id==='nt')fillNewAddr();
  else if(t.id==='us')fillUrgent();
  else if(t.id==='ut')fillUrgent(true);
  else if(t.id==='npb')fillPoRows();
  else if(t.id==='docsup'){S.docSup=t.value;render()}
  else if(t.id==='iv-pay'){const pp=payments.find(x=>x.id===t.value);$('#iv-amt').value=pp.amount.toFixed(2);$('#iv-due').value=isoDate(pp.due)}
  else if(t.id==='posup'){S.poSup=t.value;render()}
  else if(t.id==='pobrand'){S.poBrand=t.value;render()}
  else if(t.id==='porange'){S.poRange=t.value;render()}
  else if(t.id==='pofrom'){S.poFrom=t.value;render()}
  else if(t.id==='poto'){S.poTo=t.value;render()}
  else if(t.id==='pobasis'){S.poBasis=t.value;render()}
  else if(t.id==='paysup'){S.paySup=t.value;render()}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.q=ev.target.value;S.show=20;$('#tbl').innerHTML=brandTable()}
  if(ev.target.id==='docq'){S.docQ=ev.target.value;const p=ev.target.selectionStart;render();const i=$('#docq');i.focus();i.setSelectionRange(p,p)}
  if(ev.target.id==='invq'){S.invQ=ev.target.value;const p=ev.target.selectionStart;render();const i=$('#invq');i.focus();i.setSelectionRange(p,p)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.matches('tr[data-act]'))ACTIONS[ev.target.dataset.act](ev.target,ev);
  if(ev.key==='Escape')$('#layer').innerHTML='';
});
const tip=$('#tip');
document.addEventListener('mousemove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.opacity=1;tip.style.left=ev.clientX+'px';tip.style.top=ev.clientY+'px'}else tip.style.opacity=0});

function render(){
  renderTop();renderSide();
  const PAGES={alerts:renderAlerts,docs:renderDocs,pos:renderPOs,payments:renderPayments,brand:renderBrand,requests:renderRequests,inventory:renderInventory,opsHome:renderOpsHome,psHome:renderPsHome,tracker:renderTracker,activity:renderActivity,portfolio:renderPortfolio};
  $('#app').innerHTML=(S.role==='ops'&&S.page!=='alerts'?urgentBanner():'')+(S.role==='supplier'?renderSupplier():(PAGES[S.page]||renderPortfolio)());
  $('#layer').innerHTML='';
  enhanceTables($('#app'),'A');
}
render();
</script>
